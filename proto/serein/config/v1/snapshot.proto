syntax = "proto3";

package serein.config.v1;

import "serein/options/v1/options.proto";

option (serein.options.v1.file) = {cpp_namespace: "Snapshot"};

// Options of the message snapshot box.
message SnapshotConfig {
  option (serein.options.v1.document) = {version: 2};
  option (serein.options.v1.codec) = {require_fields: true};

  bool background = 1;
  bool date = 2;
  bool headers = 3;
  bool reactions = 4;
  bool builtin_theme = 5;
  bool simple_replies = 6;
}
