syntax = "proto3";

package serein.config.v1;

import "buf/validate/validate.proto";
import "serein/options/v1/options.proto";

option (serein.options.v1.file) = {cpp_namespace: "Filters"};

message FilterRules {
  option (serein.options.v1.document) = {
    version: 2
    validator: "ValidFilterRules"
  };
  option (serein.options.v1.codec) = {require_fields: true};

  bool enabled = 1;
  bool filter_outgoing = 2;
  bool hide_blocked = 3;
  bool strip_zalgo = 4;
  repeated string hidden_authors = 5 [(buf.validate.field).repeated = {
    max_items: 1000
    unique: true
    items: {
      string: {pattern: "^[1-9][0-9]*$"}
    }
  }];
  repeated string excluded_peers = 6 [(buf.validate.field).repeated = {
    max_items: 1000
    unique: true
    items: {
      string: {pattern: "^[1-9][0-9]*$"}
    }
  }];
  repeated FilterRule rules = 7 [(buf.validate.field).repeated.max_items = 32];
}

message FilterRule {
  option (serein.options.v1.codec) = {require_fields: true};

  string id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$"];
  string title = 2;
  string pattern = 3;
  string replacement = 4;
  bool enabled = 5;
  bool case_insensitive = 6;
  bool reversed = 7;
  string action = 8 [(buf.validate.field).string = {
    in: [
      "mask",
      "replace",
      "hide"
    ]
  }];
  // Serialized peer ids or peer:topic pairs the rule is limited to; empty applies everywhere.
  repeated string peers = 9 [(buf.validate.field).repeated = {
    max_items: 100
    unique: true
    items: {
      string: {pattern: "^[1-9][0-9]*(:[1-9][0-9]*)?$"}
    }
  }];
}

// Rules shared through the clipboard, without account-specific switches.
message FilterRuleList {
  option (serein.options.v1.document) = {version: 2};
  option (serein.options.v1.codec) = {require_fields: true};

  repeated FilterRule rules = 1 [(buf.validate.field).repeated.max_items = 32];
}
