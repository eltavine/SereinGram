syntax = "proto3";

package serein.config.v1;

import "buf/validate/validate.proto";
import "serein/options/v1/options.proto";

option (serein.options.v1.file) = {cpp_namespace: "ServicesSchema"};

// Translation and transcription services; API keys live in the system keychain.
message ServicesConfig {
  option (serein.options.v1.document) = {
    version: 2
    validator: "ValidServicesConfig"
  };
  option (serein.options.v1.codec) = {require_fields: true};

  string translation = 1;
  string transcription = 2;
  repeated ServiceInstance instances = 3;
}

message ServiceInstance {
  option (serein.options.v1.codec) = {require_fields: true};

  string id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$"];
  string name = 2;
  string kind = 3 [(buf.validate.field).string = {
    in: [
      "translation",
      "transcription"
    ]
  }];
  string protocol = 4 [(buf.validate.field).string = {
    in: [
      "openai",
      "anthropic",
      "deepl",
      "deeplx",
      "google",
      "yandex",
      "transmart",
      "azure"
    ]
  }];
  string base_url = 5;
  string endpoint = 6;
  string model = 7;
  string credential_ref = 8 [(buf.validate.field).string.pattern = "^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$"];
  bool use_key = 9;
  string system_prompt = 10;
  string prompt = 11;
  string language = 12 [(buf.validate.field).string.pattern = "^([a-z]{2})?$"];
  optional double temperature = 13 [(buf.validate.field).double = {
    gte: 0
    lte: 2
  }];
  // Azure resource region; empty for global resources and other protocols.
  string region = 14 [(buf.validate.field).string.pattern = "^([a-z0-9]{1,32})?$"];
}
