syntax = "proto3";

package serein.config.v1;

import "buf/validate/validate.proto";
import "serein/options/v1/options.proto";

option (serein.options.v1.file) = {cpp_namespace: "Compose"};

// Links offered to an inline bot when a link is the whole message draft.
message LinkInlineBots {
  option (serein.options.v1.document) = {
    version: 1
    validator: "ValidLinkInlineBots"
  };
  option (serein.options.v1.codec) = {require_fields: true};

  repeated LinkInlineBot rules = 1 [(buf.validate.field).repeated.max_items = 50];
}

message LinkInlineBot {
  option (serein.options.v1.codec) = {require_fields: true};

  string bot = 1 [(buf.validate.field).string = {pattern: "^[A-Za-z][A-Za-z0-9_]{2,31}$"}];
  string pattern = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
}
