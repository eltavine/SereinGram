syntax = "proto3";

package serein.settings.v1;

import "buf/validate/validate.proto";
import "serein/options/v1/options.proto";

message MediaSettings {
  option (serein.options.v1.page) = {
    cpp_namespace: "Media"
    scope: SCOPE_DEVICE
    category: CATEGORY_MEDIA
    subpage: {
      title: "lng_serein_media"
      icon: "menuIconPhoto"
      keywords: [
        "media",
        "sticker",
        "emoji"
      ]
    }
  };

  optional int32 sticker_scale = 1 [
    (serein.options.v1.field) = {
      section: {
        title: "lng_serein_section_stickers"
        id: "stickers"
        keywords: [
          "sticker",
          "emoji"
        ]
      }
      refresh: REFRESH_MESSAGE_VIEW
      default_int: 100
      keywords: [
        "sticker",
        "size"
      ]
      choice: {suffix: "%"}
      icon: "menuIconEnlarge"
    },
    (buf.validate.field).int32 = {
      in: [
        50,
        75,
        100,
        125,
        150,
        175,
        200
      ]
    }
  ];
  optional bool hide_sticker_time = 2 [(serein.options.v1.field) = {
    keywords: [
      "sticker",
      "time"
    ]
    refresh: REFRESH_MESSAGE_VIEW
    icon: "menuIconTimer"
  }];
  optional bool rounded_stickers = 13 [(serein.options.v1.field) = {
    keywords: [
      "sticker",
      "rounded",
      "corners"
    ]
    refresh: REFRESH_MESSAGE_VIEW
    icon: "menuIconStickers"
  }];
  optional int32 recent_sticker_limit = 3 [
    (serein.options.v1.field) = {
      keywords: [
        "recent",
        "sticker",
        "limit"
      ]
      number: {zero_label: "lng_serein_preview_follow"}
      icon: "menuIconReschedule"
    },
    (buf.validate.field).int32 = {
      gte: 0
      lte: 200
    }
  ];
  optional bool hide_group_stickers = 4 [(serein.options.v1.field) = {
    keywords: [
      "group",
      "sticker"
    ]
    icon: "menuIconGroupsHide"
  }];
  optional bool hide_recommended_stickers = 5 [(serein.options.v1.field) = {
    keywords: [
      "recommended",
      "sticker"
    ]
    icon: "menuIconStickerAdd"
  }];
  optional bool hide_recommended_emoji = 6 [(serein.options.v1.field) = {
    keywords: [
      "recommended",
      "emoji"
    ]
    icon: "menuIconEmoji"
  }];
  optional bool hide_greeting_sticker = 8 [(serein.options.v1.field) = {
    keywords: [
      "greeting",
      "sticker"
    ]
    icon: "menuIconWelcomeMessage"
  }];
  optional bool sticker_pack_author = 16 [(serein.options.v1.field) = {
    keywords: [
      "sticker",
      "emoji",
      "pack",
      "author",
      "creator"
    ]
    icon: "menuIconProfile"
  }];
  optional string sticker_author_bot = 14 [
    (serein.options.v1.field) = {
      title: "lng_serein_sticker_author_bot"
      keywords: [
        "sticker",
        "author",
        "bot",
        "lookup"
      ]
      note: "lng_serein_sticker_author_bot_note"
      text: {placeholder: "lng_serein_sticker_author_bot_placeholder"}
      icon: "menuIconBot"
    },
    (buf.validate.field).string = {
      max_len: 33
      pattern: "^(@?[A-Za-z][A-Za-z0-9_]{3,31})?$"
    }
  ];
  optional bool hide_gif_categories = 7 [(serein.options.v1.field) = {
    section: {
      title: "lng_serein_section_gifs_videos"
      id: "gifs-videos"
      keywords: [
        "GIF",
        "video"
      ]
    }
    keywords: [
      "GIF",
      "categories"
    ]
    icon: "menuIconGif"
  }];
  optional bool disable_video_autoplay = 9 [(serein.options.v1.field) = {
    keywords: [
      "video",
      "autoplay"
    ]
    refresh: REFRESH_MESSAGE_VIEW
    icon: "menuIconStartStream"
  }];
  optional bool gif_playback_controls = 10 [(serein.options.v1.field) = {
    keywords: [
      "GIF",
      "playback",
      "controls"
    ]
    icon: "menuIconCustomize"
  }];
  optional bool mp4_file_preview = 11 [(serein.options.v1.field) = {
    keywords: [
      "MP4",
      "file",
      "preview"
    ]
    icon: "menuIconFile"
  }];
  optional bool force_click_preview = 15 [(serein.options.v1.field) = {
    keywords: [
      "Force Click",
      "Force Touch",
      "trackpad",
      "preview",
      "haptic"
    ]
    note: "lng_serein_force_click_preview_note"
    icon: "menuIconTouchID"
  }];
  optional bool downloads_per_chat = 17 [(serein.options.v1.field) = {
    section: {
      title: "lng_serein_section_more_media"
      id: "more-media"
      keywords: [
        "files",
        "voice",
        "stories"
      ]
    }
    keywords: [
      "download",
      "folder",
      "chat",
      "channel",
      "organize"
    ]
    note: "lng_serein_downloads_per_chat_note"
    icon: "menuIconShowInFolder"
  }];
  optional bool denoise_voice_messages = 12 [(serein.options.v1.field) = {
    keywords: [
      "noise",
      "voice",
      "recording",
      "microphone"
    ]
    note: "lng_serein_denoise_voice_messages_note"
    icon: "menuIconVideoChat"
  }];
  optional bool story_posting = 18 [(serein.options.v1.field) = {
    keywords: [
      "story",
      "stories",
      "post",
      "publish",
      "close friends"
    ]
    note: "lng_serein_story_posting_note"
    icon: "menuIconStoriesSavedSection"
  }];
}
