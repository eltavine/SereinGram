syntax = "proto3";

package serein.settings.v1;

import "buf/validate/validate.proto";
import "serein/options/v1/options.proto";

message InterfaceSettings {
  option (serein.options.v1.page) = {
    cpp_namespace: "Interface"
    scope: SCOPE_DEVICE
    category: CATEGORY_INTERFACE
  };

  optional int32 bubble_roundness = 1 [
    (serein.options.v1.field) = {
      section: {title: "lng_serein_roundness_and_shapes" id: "roundness" keywords: ["corners", "shapes"]}
      restart: true
    },
    (buf.validate.field).int32 = {gte: 10, lte: 100}
  ];
  optional int32 avatar_roundness = 2 [
    (serein.options.v1.field) = {
      restart: true
    },
    (buf.validate.field).int32 = {gte: 10, lte: 100}
  ];
  optional bool uniform_avatar_shapes = 3 [
    (serein.options.v1.field) = {
      custom_ui: true
      restart: true
    }
  ];
  optional int32 text_message_width = 4 [
    (serein.options.v1.field) = {
      section: {title: "lng_serein_message_style" id: "message-style" keywords: ["messages", "style"]}
      refresh: REFRESH_MESSAGE_VIEW
    },
    (buf.validate.field).int32 = {gte: 50, lte: 400}
  ];
  optional bool wide_channel_posts = 5 [
    (serein.options.v1.field) = {
      keywords: ["channel", "width"]
      refresh: REFRESH_MESSAGE_VIEW
    }
  ];
  optional bool hide_bubble_tail = 6 [
    (serein.options.v1.field) = {
      keywords: ["bubble", "tail"]
      refresh: REFRESH_MESSAGE_VIEW
    }
  ];
  optional bool theme_reply_colors = 7 [
    (serein.options.v1.field) = {
      keywords: ["reply", "quote", "color"]
      refresh: REFRESH_MESSAGE_VIEW
    }
  ];
  optional bool hide_reply_thumbnail = 8 [
    (serein.options.v1.field) = {
      keywords: ["reply", "thumbnail"]
      refresh: REFRESH_MESSAGE_VIEW
    }
  ];
  optional bool ignore_chat_theme = 9 [(serein.options.v1.field) = {
    keywords: ["chat", "theme", "wallpaper"]
  }];
  optional bytes main_menu = 10 [
    (serein.options.v1.field) = {
      section: {title: "lng_serein_main_menu" id: "main-menu-heading" keywords: ["menu", "title"]}
      cpp_name: "kMainMenuConfig"
      validator: "ValidMainMenuBytes"
    }
  ];
  optional bool hide_app_icon_badge = 11 [(serein.options.v1.field) = {
    section: {title: "lng_serein_window_notification" id: "window-notification" keywords: ["window", "notification"]}
    keywords: ["dock", "icon", "badge"]
  }];
  optional int32 notification_delay = 12 [
    (buf.validate.field).int32 = {in: [0, 500, 1000, 2000, 5000, 10000, 30000, 60000]}
  ];
  optional int32 other_device_notification_delay = 13 [
    (buf.validate.field).int32 = {in: [0, 500, 1000, 2000, 5000, 10000, 30000, 60000]}
  ];
  optional bool halfwidth_ui_punctuation = 14 [
    (serein.options.v1.field) = {
      section: {title: "lng_serein_ui_text" id: "text" keywords: ["text", "punctuation"]}
      keywords: ["text", "punctuation"]
      restart: true
    }
  ];
  optional bool more_accounts = 15 [(serein.options.v1.field) = {
    section: {title: "lng_serein_accounts" id: "accounts" keywords: ["accounts"]}
    keywords: ["accounts", "limit", "multiple"]
    note: "lng_serein_more_accounts_note"
  }];
}
