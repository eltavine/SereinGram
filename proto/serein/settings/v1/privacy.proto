syntax = "proto3";

package serein.settings.v1;

import "buf/validate/validate.proto";
import "serein/options/v1/options.proto";

message PrivacySettings {
  option (serein.options.v1.page) = {
    cpp_namespace: "Privacy"
    scope: SCOPE_DEVICE
    category: CATEGORY_PRIVACY
  };

  optional bool demo_mode = 1 [(serein.options.v1.field) = {
    keywords: ["presentation", "capture"]
    note: "lng_serein_demo_mode_note"
  }];
  optional bool auto_demo_mode = 10 [(serein.options.v1.field) = {
    keywords: ["presentation", "OBS", "recording", "streaming"]
    note: "lng_serein_auto_demo_mode_note"
  }];
  optional bool hide_read_time = 2 [(serein.options.v1.field) = {
    keywords: ["read", "time"]
  }];
  optional bool hide_share_phone_prompt = 3 [(serein.options.v1.field) = {
    keywords: ["share", "phone"]
  }];
  optional int32 profile_id_format = 4 [
    (serein.options.v1.field) = {
      keywords: ["profile", "ID"]
      choice: {
        labels: ["lng_serein_id_off", "lng_serein_id_bot_api", "lng_serein_id_raw"]
      }
    },
    (buf.validate.field).int32 = {gte: 0, lte: 2}
  ];
  optional bool show_profile_dc = 5 [(serein.options.v1.field) = {
    keywords: ["profile", "DC"]
  }];
  optional bool show_registration_date = 9 [(serein.options.v1.field) = {
    keywords: ["profile", "registration", "account age"]
    note: "lng_serein_registration_date_note"
  }];
  optional bool hide_profile_gifts = 6 [(serein.options.v1.field) = {
    keywords: ["profile", "gifts"]
  }];
  optional bool hide_create_todo = 7 [(serein.options.v1.field) = {
    keywords: ["todo", "list"]
  }];
  // Forwarding stays blocked because Telegram rejects it server-side.
  optional bool save_protected_content = 8 [(serein.options.v1.field) = {
    keywords: ["protected", "save", "copy", "noforwards"]
    note: "lng_serein_save_protected_content_note"
  }];
}
