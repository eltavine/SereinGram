syntax = "proto3";

package serein.settings.v1;

import "buf/validate/validate.proto";
import "serein/options/v1/options.proto";

message PrivacySettings {
  option (serein.options.v1.page) = {
    cpp_namespace: "Privacy"
    scope: SCOPE_DEVICE
    category: CATEGORY_PRIVACY
    subpage: {
      title: "lng_serein_privacy"
      icon: "menuIconLock"
      keywords: [
        "privacy",
        "phone"
      ]
    }
  };

  optional bool demo_mode = 1 [(serein.options.v1.field) = {
    section: {
      title: "lng_serein_section_screen"
      id: "screen"
      keywords: [
        "streamer",
        "screen",
        "lock"
      ]
    }
    keywords: [
      "presentation",
      "capture"
    ]
    note: "lng_serein_demo_mode_note"
    icon: "menuIconSpoiler"
  }];
  optional bool auto_demo_mode = 10 [(serein.options.v1.field) = {
    keywords: [
      "presentation",
      "OBS",
      "recording",
      "streaming"
    ]
    note: "lng_serein_auto_demo_mode_note"
    icon: "menuIconStartStreamWith"
  }];
  optional bool lock_settings = 11 [(serein.options.v1.field) = {
    keywords: [
      "lock",
      "passcode",
      "settings"
    ]
    note: "lng_serein_lock_settings_note"
    icon: "menuIcon2SV"
  }];
  optional int32 profile_id_format = 4 [
    (serein.options.v1.field) = {
      section: {
        title: "lng_serein_section_profiles"
        id: "profiles"
        keywords: [
          "profile",
          "ID"
        ]
      }
      keywords: [
        "profile",
        "ID"
      ]
      choice: {
        labels: [
          "lng_serein_id_off",
          "lng_serein_id_bot_api",
          "lng_serein_id_raw"
        ]
      }
      icon: "menuIconPersonal"
    },
    (buf.validate.field).int32 = {
      gte: 0
      lte: 2
    }
  ];
  optional bool show_profile_dc = 5 [(serein.options.v1.field) = {
    keywords: [
      "profile",
      "DC"
    ]
    icon: "menuIconStorage"
  }];
  optional bool show_registration_date = 9 [(serein.options.v1.field) = {
    keywords: [
      "profile",
      "registration",
      "account age"
    ]
    note: "lng_serein_registration_date_note"
    icon: "menuIconSchedule"
  }];
  optional bool show_contact_status = 14 [(serein.options.v1.field) = {
    keywords: [
      "profile",
      "contact",
      "mutual contact"
    ]
    note: "lng_serein_contact_status_note"
    icon: "menuIconInvite"
  }];
  optional bool show_session_details = 13 [(serein.options.v1.field) = {
    keywords: [
      "sessions",
      "devices",
      "API ID",
      "login"
    ]
    note: "lng_serein_session_details_note"
    icon: "menuIconDevices"
  }];
  optional bool local_names = 12 [(serein.options.v1.field) = {
    keywords: [
      "local name",
      "alias",
      "rename",
      "nickname"
    ]
    note: "lng_serein_local_names_note"
    icon: "menuIconTagRename"
  }];
  optional bool hide_profile_gifts = 6 [(serein.options.v1.field) = {
    keywords: [
      "profile",
      "gifts"
    ]
    icon: "menuIconGiftPremium"
  }];
  optional bool hide_read_time = 2 [(serein.options.v1.field) = {
    section: {
      title: "lng_serein_section_prompts"
      id: "prompts"
      keywords: [
        "prompt",
        "protected"
      ]
    }
    keywords: [
      "read",
      "time"
    ]
    icon: "menuIconMarkRead"
  }];
  optional bool hide_share_phone_prompt = 3 [(serein.options.v1.field) = {
    keywords: [
      "share",
      "phone"
    ]
    icon: "menuIconPhone"
  }];
  optional bool hide_create_todo = 7 [(serein.options.v1.field) = {
    keywords: [
      "todo",
      "list"
    ]
    icon: "menuIconCreateTodoList"
  }];
  // Forwarding stays blocked because Telegram rejects it server-side.
  optional bool save_protected_content = 8 [(serein.options.v1.field) = {
    keywords: [
      "protected",
      "save",
      "copy",
      "noforwards"
    ]
    note: "lng_serein_save_protected_content_note"
    icon: "menuIconSaveImage"
  }];
}
