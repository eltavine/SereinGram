syntax = "proto3";

package serein.settings.v1;

import "buf/validate/validate.proto";
import "serein/options/v1/options.proto";

message ChatsSettings {
  option (serein.options.v1.page) = {
    cpp_namespace: "Chats"
    scope: SCOPE_DEVICE
    category: CATEGORY_CHATS
    subpage: {
      title: "lng_serein_chats"
      icon: "menuIconChats"
      keywords: [
        "chats",
        "list"
      ]
    }
  };

  optional bool chat_list_compact = 1 [(serein.options.v1.field) = {
    section: {
      title: "lng_serein_chat_list"
      id: "list"
      keywords: [
        "list",
        "layout"
      ]
    }
    keywords: [
      "compact",
      "list"
    ]
    cpp_name: "kCompactList"
    title: "lng_serein_compact_chat_list"
    refresh: REFRESH_DIALOG_LIST
    icon: "menuIconShrink"
  }];
  optional int32 chat_preview_lines = 2 [
    (serein.options.v1.field) = {
      cpp_name: "kPreviewLines"
      refresh: REFRESH_DIALOG_LIST
      keywords: [
        "preview",
        "lines"
      ]
      choice: {
        labels: [
          "lng_serein_preview_follow",
          "lng_serein_preview_one",
          "lng_serein_preview_two",
          "lng_serein_preview_three"
        ]
      }
      icon: "menuIconAsMessages"
    },
    (buf.validate.field).int32 = {
      gte: 0
      lte: 3
    }
  ];
  optional int32 chat_sort = 11 [(serein.options.v1.field) = {validator: "ValidChatSort"}];
  optional bool hide_saved_and_archived_previews = 3 [(serein.options.v1.field) = {
    keywords: [
      "saved",
      "archive",
      "preview"
    ]
    refresh: REFRESH_DIALOG_LIST
    icon: "menuIconCaptionHide"
  }];
  optional bool hide_stories = 4 [(serein.options.v1.field) = {
    keywords: ["stories"]
    icon: "menuIconStoriesSavedSection"
  }];
  optional bool search_own_chats_only = 28 [(serein.options.v1.field) = {
    keywords: [
      "search",
      "global",
      "public",
      "privacy"
    ]
    note: "lng_serein_search_own_chats_only_note"
    icon: "menuIconSearch"
  }];
  optional int32 startup_folder_mode = 8 [
    (serein.options.v1.field) = {
      section: {
        title: "lng_serein_folders"
        id: "folders"
        keywords: ["folders"]
      }
      title: "lng_serein_startup_folder"
      scope: SCOPE_ACCOUNT
    },
    (buf.validate.field).int32 = {
      gte: 0
      lte: 2
    }
  ];
  optional bool hide_all_chats_folder = 5 [(serein.options.v1.field) = {
    keywords: [
      "all chats",
      "folders"
    ]
    icon: "menuIconShowInFolder"
  }];
  optional bool show_archive_in_folders = 6 [(serein.options.v1.field) = {
    keywords: [
      "archive",
      "folders"
    ]
    refresh: REFRESH_DIALOG_LIST
    icon: "menuIconArchive"
  }];
  optional bool hide_folder_unread_counters = 7 [(serein.options.v1.field) = {
    keywords: [
      "unread",
      "folders"
    ]
    icon: "menuIconMarkRead"
  }];
  optional string hidden_folder_ids = 27 [(serein.options.v1.field) = {
    title: "lng_serein_hidden_folders"
    keywords: [
      "folder",
      "hide",
      "tabs",
      "sidebar"
    ]
    scope: SCOPE_ACCOUNT
    custom_ui: true
    validator: "ValidHiddenFolderIds"
  }];
  optional bool managed_folder_filter = 26 [(serein.options.v1.field) = {
    keywords: [
      "folder",
      "admin",
      "manage",
      "groups",
      "channels"
    ]
    note: "lng_serein_managed_folder_filter_note"
    restart: true
    icon: "menuIconTagFilter"
  }];
  optional bool hide_sponsored_messages = 13 [(serein.options.v1.field) = {
    section: {
      title: "lng_serein_promotions"
      id: "promotions"
      keywords: [
        "promotions",
        "ads"
      ]
    }
    keywords: [
      "sponsored",
      "search ads"
    ]
    icon: "menuIconBlock"
  }];
  optional bool hide_proxy_sponsor = 14 [(serein.options.v1.field) = {
    keywords: [
      "proxy",
      "sponsored channel"
    ]
    icon: "menuIconNetwork"
  }];
  optional bool hide_premium_promotions = 15 [(serein.options.v1.field) = {
    keywords: [
      "Premium",
      "promotions"
    ]
    icon: "menuIconPremium"
  }];
  optional bool hide_birthday_suggestions = 16 [(serein.options.v1.field) = {
    keywords: [
      "birthday",
      "suggestion"
    ]
    icon: "menuIconGiftPremium"
  }];
  optional bool disable_scroll_to_next_channel = 17 [(serein.options.v1.field) = {
    section: {
      title: "lng_serein_scroll_navigation"
      id: "scroll-navigation"
      keywords: [
        "scroll",
        "navigation"
      ]
    }
    keywords: [
      "scroll",
      "channel"
    ]
    icon: "menuIconChannel"
  }];
  optional bool disable_scroll_to_next_topic = 18 [(serein.options.v1.field) = {
    keywords: [
      "scroll",
      "topic"
    ]
    icon: "menuIconTopics"
  }];
  optional bool remember_reading_position = 20 [(serein.options.v1.field) = {
    keywords: [
      "scroll",
      "position",
      "resume"
    ]
    note: "lng_serein_remember_reading_position_note"
    icon: "menuIconSavedMessages"
  }];
  optional bool chat_quick_actions = 22 [(serein.options.v1.field) = {
    section: {
      title: "lng_serein_section_chat_tools"
      id: "chat-tools"
      keywords: [
        "menu",
        "tools",
        "pin"
      ]
      extra: "cleanup"
    }
    keywords: [
      "toolbar",
      "search",
      "media",
      "pinned"
    ]
    note: "lng_serein_chat_quick_actions_note"
    icon: "menuIconBoosts"
  }];
  optional bool management_shortcuts = 23 [(serein.options.v1.field) = {
    keywords: [
      "admin",
      "members",
      "recent actions",
      "group"
    ]
    note: "lng_serein_management_shortcuts_note"
    icon: "menuIconAdmin"
  }];
  optional bool local_pinning = 24 [(serein.options.v1.field) = {
    keywords: [
      "pin",
      "top",
      "local"
    ]
    note: "lng_serein_local_pinning_note"
    icon: "menuIconPin"
  }];
  optional bool chat_settings_menu = 29 [(serein.options.v1.field) = {
    keywords: [
      "chat",
      "menu",
      "settings"
    ]
    note: "lng_serein_chat_settings_menu_note"
    icon: "menuIconSettings"
  }];
  optional int32 startup_folder_id = 9 [
    (serein.options.v1.field) = {
      hidden: true
      title: "lng_serein_startup_folder"
      scope: SCOPE_ACCOUNT
    },
    (buf.validate.field).int32 = {gte: 0}
  ];
  optional int32 last_opened_folder_id = 10 [
    (serein.options.v1.field) = {
      hidden: true
      title: "lng_serein_startup_folder"
      scope: SCOPE_ACCOUNT
    },
    (buf.validate.field).int32 = {gte: 0}
  ];
  optional string managed_folder_ids = 12 [(serein.options.v1.field) = {
    hidden: true
    title: "lng_serein_managed_only"
    scope: SCOPE_ACCOUNT
    validator: "ValidManagedFolderIds"
  }];
  // Serialized peer ids of recently opened chats, newest first.
  optional string recent_chats = 19 [(serein.options.v1.field) = {
    hidden: true
    title: "lng_serein_recent_chats"
    scope: SCOPE_ACCOUNT
    validator: "ValidRecentChats"
  }];
  // Serialized peer:message pairs of saved reading positions, newest first.
  optional string reading_positions = 21 [(serein.options.v1.field) = {
    hidden: true
    title: "lng_serein_reading_positions"
    scope: SCOPE_ACCOUNT
    validator: "ValidReadingPositions"
  }];
  // Serialized peer ids of locally pinned chats, in pin order.
  optional string local_pins = 25 [(serein.options.v1.field) = {
    hidden: true
    title: "lng_serein_local_pins"
    scope: SCOPE_ACCOUNT
    validator: "ValidLocalPins"
  }];
}
