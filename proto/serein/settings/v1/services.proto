syntax = "proto3";

package serein.settings.v1;

import "buf/validate/validate.proto";
import "serein/options/v1/options.proto";

// Translation and transcription services; the services page edits them by hand.
message ServicesSettings {
  option (serein.options.v1.page) = {
    cpp_namespace: "ServiceSettings"
    scope: SCOPE_DEVICE
    category: CATEGORY_SERVICES
  };

  optional bytes services = 1 [(serein.options.v1.field) = {
    cpp_name: "kServicesConfig"
    title: "lng_serein_services"
    custom_ui: true
    validator: "ValidServicesBytes"
  }];
  optional bool prefer_system_ai = 2 [(serein.options.v1.field) = {
    title: "lng_serein_system_ai"
    custom_ui: true
    refresh: [REFRESH_COMPOSE_BUTTONS]
  }];
  optional bool translation_context = 6 [(serein.options.v1.field) = {
    custom_ui: true
  }];
  optional bool chat_translation_without_premium = 8 [(serein.options.v1.field) = {
    custom_ui: true
  }];
  optional string proxy_subscription = 3 [
    (serein.options.v1.field) = {
      title: "lng_serein_proxy_subscription"
      custom_ui: true
    },
    (buf.validate.field).string = {max_len: 2048, pattern: "^(https://[^\\s]+)?$"}
  ];
  optional bytes proxy_notes = 9 [(serein.options.v1.field) = {
    title: "lng_serein_proxy_notes"
    custom_ui: true
    validator: "ValidProxyNotes"
  }];
  optional bool pause_proxy_on_vpn = 4 [(serein.options.v1.field) = {
    title: "lng_serein_proxy_vpn"
    custom_ui: true
  }];
  optional bool proxy_paused_by_vpn = 5 [(serein.options.v1.field) = {
    title: "lng_serein_proxy_vpn"
    hidden: true
  }];
  optional string custom_doh = 7 [
    (serein.options.v1.field) = {
      custom_ui: true
    },
    (buf.validate.field).string = {
      max_len: 253
      pattern: "^(([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\\.)+[A-Za-z]{2,63})?$"
    }
  ];
  optional bool android_web_apps = 10 [(serein.options.v1.field) = {
    keywords: ["mini apps", "web apps", "bots", "Android"]
    custom_ui: true
  }];
}
