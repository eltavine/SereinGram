syntax = "proto3";

package serein.settings.v1;

import "buf/validate/validate.proto";
import "serein/options/v1/options.proto";

// Translation, transcription and network services; rows follow the field order.
message ServicesSettings {
  option (serein.options.v1.page) = {
    cpp_namespace: "ServiceSettings"
    scope: SCOPE_DEVICE
    category: CATEGORY_SERVICES
  };

  optional bytes services = 1 [(serein.options.v1.field) = {
    cpp_name: "kServicesConfig"
    title: "lng_serein_services"
    custom_ui: true
    validator: "ValidServicesBytes"
  }];
  optional bool prefer_system_ai = 2 [(serein.options.v1.field) = {
    title: "lng_serein_system_ai"
    custom_ui: true
    refresh: [REFRESH_COMPOSE_BUTTONS]
  }];
  optional bool translation_context = 6 [(serein.options.v1.field) = {
    keywords: [
      "LLM",
      "context",
      "translate"
    ]
    note: "lng_serein_translation_context_about"
  }];
  optional bool chat_translation_without_premium = 8 [(serein.options.v1.field) = {
    title: "lng_serein_chat_translation"
    keywords: [
      "translate",
      "chat",
      "Premium"
    ]
    note: "lng_serein_chat_translation_about"
  }];
  optional bool auto_translate_chats = 11 [(serein.options.v1.field) = {
    scope: SCOPE_ACCOUNT
    keywords: [
      "translate",
      "automatic",
      "chat"
    ]
    note: "lng_serein_auto_translate_chats_about"
  }];
  optional bytes send_translations = 15 [(serein.options.v1.field) = {
    scope: SCOPE_ACCOUNT
    title: "lng_serein_send_translation"
    keywords: [
      "translate",
      "send",
      "outgoing"
    ]
    custom_ui: true
    validator: "ValidSendTranslationsBytes"
  }];
  optional bool instant_view_translation = 12 [(serein.options.v1.field) = {
    keywords: [
      "translate",
      "Instant View",
      "article"
    ]
    note: "lng_serein_instant_view_translation_about"
  }];
  optional int32 auto_transcribe = 16 [
    (serein.options.v1.field) = {
      scope: SCOPE_ACCOUNT
      keywords: [
        "voice",
        "transcribe",
        "speech",
        "automatic"
      ]
      note: "lng_serein_auto_transcribe_about"
      choice: {
        labels: [
          "lng_serein_auto_transcribe_off",
          "lng_serein_auto_transcribe_private",
          "lng_serein_auto_transcribe_all"
        ]
      }
    },
    (buf.validate.field).int32 = {
      gte: 0
      lte: 2
    }
  ];
  optional string proxy_subscription = 3 [
    (serein.options.v1.field) = {
      title: "lng_serein_proxy_subscription"
      custom_ui: true
    },
    (buf.validate.field).string = {
      max_len: 2048
      pattern: "^(https://[^\\s]+)?$"
    }
  ];
  optional bytes proxy_notes = 9 [(serein.options.v1.field) = {
    title: "lng_serein_proxy_notes"
    custom_ui: true
    validator: "ValidProxyNotes"
  }];
  optional bool pause_proxy_on_vpn = 4 [(serein.options.v1.field) = {
    title: "lng_serein_proxy_vpn"
    keywords: [
      "proxy",
      "VPN"
    ]
    note: "lng_serein_proxy_vpn_about"
  }];
  optional bool proxy_paused_by_vpn = 5 [(serein.options.v1.field) = {
    title: "lng_serein_proxy_vpn"
    hidden: true
  }];
  optional string custom_doh = 7 [
    (serein.options.v1.field) = {custom_ui: true},
    (buf.validate.field).string = {
      max_len: 253
      pattern: "^(([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\\.)+[A-Za-z]{2,63})?$"
    }
  ];
  optional bool system_dns = 14 [(serein.options.v1.field) = {
    keywords: [
      "DNS",
      "DoH",
      "proxy",
      "Google"
    ]
    note: "lng_serein_system_dns_note"
  }];
  optional bool faster_transfers = 13 [(serein.options.v1.field) = {
    title: "lng_serein_faster_transfers"
    keywords: [
      "upload",
      "download",
      "speed"
    ]
    note: "lng_serein_faster_transfers_about"
  }];
  optional bool android_web_apps = 10 [(serein.options.v1.field) = {
    keywords: [
      "mini apps",
      "web apps",
      "bots",
      "Android"
    ]
    note: "lng_serein_android_web_apps_about"
  }];
}
