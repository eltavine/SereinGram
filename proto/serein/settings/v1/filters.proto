syntax = "proto3";

package serein.settings.v1;

import "buf/validate/validate.proto";
import "serein/options/v1/options.proto";

// Message filter rules; the rules settings page edits them by hand.
message FilterSettings {
  option (serein.options.v1.page) = {
    cpp_namespace: "Filters"
    scope: SCOPE_ACCOUNT
    category: CATEGORY_RULES
  };

  optional bytes filters = 1 [(serein.options.v1.field) = {
    cpp_name: "kRules"
    title: "lng_serein_filter_rules"
    custom_ui: true
    validator: "Validate"
    refresh: REFRESH_MESSAGE_VIEW
  }];
  optional string rule_subscription = 2 [
    (serein.options.v1.field) = {
      title: "lng_serein_filter_subscription"
      scope: SCOPE_DEVICE
      custom_ui: true
    },
    (buf.validate.field).string = {max_len: 2048, pattern: "^(https://[^\\s]+)?$"}
  ];
  optional bytes subscribed_rules = 3 [(serein.options.v1.field) = {
    title: "lng_serein_filter_subscription"
    scope: SCOPE_DEVICE
    hidden: true
    validator: "ValidRuleList"
    refresh: REFRESH_MESSAGE_VIEW
  }];
  optional string hidden_messages = 4 [(serein.options.v1.field) = {
    title: "lng_serein_hidden_messages"
    custom_ui: true
    validator: "ValidHiddenMessages"
    refresh: REFRESH_MESSAGE_VIEW
  }];
}
