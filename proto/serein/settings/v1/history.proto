syntax = "proto3";

package serein.settings.v1;

import "buf/validate/validate.proto";
import "serein/options/v1/options.proto";

message HistorySettings {
  option (serein.options.v1.page) = {
    cpp_namespace: "HistorySettings"
    scope: SCOPE_ACCOUNT
    category: CATEGORY_PRIVACY
    subpage: {
      title: "lng_serein_history_page"
      icon: "menuIconRestore"
      keywords: [
        "deleted",
        "edited",
        "anti-recall",
        "history"
      ]
    }
  };

  optional bool history_save_deleted = 1 [(serein.options.v1.field) = {
    keywords: [
      "deleted",
      "anti-recall",
      "history"
    ]
  }];
  optional bool history_keep_deleted_in_place = 6 [(serein.options.v1.field) = {
    keywords: [
      "deleted",
      "anti-recall",
      "in chat"
    ]
  }];
  optional bool history_keep_expired_media = 8 [(serein.options.v1.field) = {
    keywords: [
      "self-destruct",
      "view once",
      "expired",
      "media"
    ]
  }];
  optional bool history_keep_removed_chats = 9 [(serein.options.v1.field) = {
    keywords: [
      "banned",
      "kicked",
      "removed",
      "channel",
      "group"
    ]
    note: "lng_serein_history_keep_removed_chats_note"
  }];
  optional bool history_save_edits = 2 [(serein.options.v1.field) = {
    keywords: [
      "edit",
      "history"
    ]
  }];
  optional bool history_include_bots = 3 [(serein.options.v1.field) = {
    keywords: [
      "bots",
      "history"
    ]
  }];
  // Zero keeps records until they are cleared by hand.
  optional int32 history_retention_days = 4 [
    (serein.options.v1.field) = {
      keywords: [
        "history",
        "retention",
        "days"
      ]
      number: {
        zero_label: "lng_serein_history_keep_forever"
        count_format: "lng_days"
      }
    },
    (buf.validate.field).int32 = {
      gte: 0
      lte: 3650
    }
  ];
  // Zero keeps any number of records.
  optional int32 history_max_records = 5 [
    (serein.options.v1.field) = {
      keywords: [
        "history",
        "limit",
        "records"
      ]
      number: {zero_label: "lng_serein_history_unlimited"}
      note: "lng_serein_history_note"
    },
    (buf.validate.field).int32 = {
      gte: 0
      lte: 10000000
    }
  ];
  optional bytes history_excluded_peers = 7 [(serein.options.v1.field) = {
    hidden: true
    validator: "ValidHistoryExclusions"
  }];
}
