syntax = "proto3";

package serein.options.v1;

import "google/protobuf/descriptor.proto";

enum Scope {
  SCOPE_UNSPECIFIED = 0;
  SCOPE_DEVICE = 1;
  SCOPE_ACCOUNT = 2;
}

enum Category {
  CATEGORY_UNSPECIFIED = 0;
  CATEGORY_INTERFACE = 1;
  CATEGORY_CHATS = 2;
  CATEGORY_MESSAGES = 3;
  CATEGORY_COMPOSE = 4;
  CATEGORY_MENU = 5;
  CATEGORY_MEDIA = 6;
  CATEGORY_PRIVACY = 7;
  CATEGORY_SERVICES = 8;
  CATEGORY_RULES = 9;
}

enum Refresh {
  REFRESH_UNSPECIFIED = 0;
  REFRESH_MESSAGE_VIEW = 1;
  REFRESH_DIALOG_LIST = 2;
  REFRESH_COMPOSE_BUTTONS = 3;
}

// A message annotated with page options declares one settings page.
message PageOptions {
  // Namespace below Serein that receives the generated declarations.
  string cpp_namespace = 1;
  Scope scope = 2;
  Category category = 3;
  // Set when the page is its own section opened from another page.
  Subpage subpage = 4;
}

message Subpage {
  // Lang key of the section title and of the button that opens it.
  string title = 1;
  // Name of the style::icon in st:: shown on that button.
  string icon = 2;
  repeated string keywords = 3;
  // Lang key of the explanation under that button. Unset means
  // lng_serein_page_<proto file name>_about.
  string about = 4;
}

// Unset fields follow the naming convention: the C++ constant is
// k<FieldNameInCamelCase>, the storage key is serein.<json_name> and the
// title is lng_serein_<field_name>.
message FieldOptions {
  string cpp_name = 1;
  string title = 2;
  Scope scope = 3;
  repeated Refresh refresh = 4;
  bool restart = 5;
  // Internal state: no settings row and never exported.
  bool hidden = 6;
  // Predicate implemented in C++ for rules protovalidate cannot express.
  string validator = 7;
  oneof default_value {
    bool default_bool = 8;
    int32 default_int = 9;
    string default_string = 10;
  }
  // Words the settings search matches besides the title.
  repeated string keywords = 11;
  // The page draws this option itself instead of a generated row.
  bool custom_ui = 12;
  // Subsection title shown before this option.
  Section section = 13;
  // Lang key of the explanation shown below this option.
  string note = 14;
  // Name of a boolean field on the same page that disables this toggle.
  string disabled_by = 15;
  // Generates a number input row for an int32 option with gte and lte rules.
  NumberInput number = 16;
  // Generates a single choice row for an int32 option.
  ChoiceInput choice = 17;
  TextInput text = 18;
  // Menu icon style shown on a colored tile, for example "menuIconInfo".
  string icon = 19;
  // Lang key of the explanation under the row, "lng_serein_<field>_about" when empty.
  string about = 20;
}

message TextInput {
  // Lang key shown in the empty field and as the row label while unset.
  string placeholder = 1;
}

message ChoiceInput {
  // Lang keys for the values 0, 1, 2 and so on, matching gte 0 and lte.
  repeated string labels = 1;
  // Appended to each value of the in rule when there are no labels.
  string suffix = 2;
}

message NumberInput {
  // Lang key shown for zero, which the input writes when it is left empty.
  string zero_label = 1;
  // Lang key of a {count} plural used for every other value.
  string count_format = 2;
  // Appended to every other value when there is no count_format.
  string suffix = 3;
  // Lang key of the input placeholder, which defaults to zero_label.
  string hint = 4;
}

message Section {
  // Lang key of the title.
  string title = 1;
  // Search id suffix below serein/<page>/.
  string id = 2;
  repeated string keywords = 3;
  // Lang key of the explanation that closes the section.
  string note = 4;
  // Name of a custom row the page draws at the end of the section.
  string extra = 5;
}

// A file annotated with file options gets C++ types and JSON codecs.
message FileOptions {
  // Namespace below Serein that receives the generated types.
  string cpp_namespace = 1;
}

// A message annotated with document options is a persisted JSON document.
message DocumentOptions {
  // Written as "version" and required on read when set.
  int32 version = 1;
  // Predicate implemented in C++ that runs after the structural checks.
  string validator = 2;
}

message CodecOptions {
  // Every field must be present on read, as the existing formats require.
  bool require_fields = 1;
}

extend google.protobuf.FileOptions {
  FileOptions file = 50001;
}

extend google.protobuf.MessageOptions {
  PageOptions page = 50001;
  DocumentOptions document = 50002;
  CodecOptions codec = 50003;
}

extend google.protobuf.FieldOptions {
  FieldOptions field = 50001;
}
