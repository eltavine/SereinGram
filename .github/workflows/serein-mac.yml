name: Serein MacOS.

on:
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/serein-mac.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/configure.bat'
  pull_request:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/serein-mac.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/configure.bat'
  workflow_dispatch:
    inputs:
      config:
        type: choice
        options: [Debug, Release]
        default: Debug
  workflow_call:
    inputs:
      config:
        type: string
        default: Debug
      ref:
        type: string
        default: ''
      channel:
        type: string
        default: ''
    secrets:
      SEREIN_API_ID:
        required: false
      SEREIN_API_HASH:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-macos-${{ inputs.config || 'Debug' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  macos:
    name: MacOS
    runs-on: macos-26

    env:
      CONFIG: ${{ inputs.config || 'Debug' }}
      # WHY: only default-branch runs write caches, which every branch and pull request can read.
      # A schedule event has no repository payload, but scheduled runs only start on the default branch.
      SAVE_CACHE: ${{ github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"

      - name: Clone.
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          sudo chown -R "$(whoami)":admin /usr/local/share
          retry="$REPO_NAME/tools/serein/retry.sh"

          "$retry" 3 30 brew update
          brew upgrade || true
          "$retry" 3 30 brew install automake libtool meson nasm ninja pkg-config

          # Disable spotlight.
          sudo mdutil -a -i off

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake

      # WHY: prepare.py keys every stage on the compiler and SDK, so a runner
      # image with another Xcode must miss the exact cache key and save anew.
      - name: Toolchain fingerprint.
        run: |
          fingerprint=$( {
            xcrun --find clang
            xcrun clang --version
            xcrun --sdk macosx --show-sdk-version
            xcrun --sdk macosx --show-sdk-build-version
          } | shasum -a 256 | cut -c1-16 )
          echo "TOOLCHAIN_KEY=$fingerprint" >> "$GITHUB_ENV"

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-libs-v2-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}-${{ env.TOOLCHAIN_KEY }}
          restore-keys: |
            ${{ runner.OS }}-libs-v2-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}-
            ${{ runner.OS }}-libs-v2-
            ${{ runner.OS }}-libs-

      # Debug and Release libraries, so both configurations share one cache.
      - name: Libraries.
        run: |
          "./$REPO_NAME/Telegram/build/prepare/mac.sh" silent

      - name: Free up some disk space.
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      - name: Save the libraries cache.
        if: env.SAVE_CACHE == 'true' && steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Report every compile error in one run.
        run: defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES

      - name: Serein build.
        env:
          SEREIN_API_ID: ${{ secrets.SEREIN_API_ID }}
          SEREIN_API_HASH: ${{ secrets.SEREIN_API_HASH }}
          CHANNEL: ${{ inputs.channel }}
          COMMIT: ${{ inputs.ref }}
        run: |
          cd "$REPO_NAME/Telegram"

          # Without the repository secrets, build with the test-only credentials.
          API=()
          if [ -z "$SEREIN_API_ID" ]; then
            API=(-D TDESKTOP_API_TEST=ON)
          fi
          INFO=()
          if [ -n "$CHANNEL" ]; then
            INFO=(-D SEREIN_BUILD_CHANNEL="$CHANNEL" -D SEREIN_BUILD_COMMIT="$COMMIT")
          fi

          ./configure.sh \
            -D CMAKE_CONFIGURATION_TYPES="$CONFIG" \
            -D DESKTOP_APP_TEST_APPS=ON \
            -D CMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            "${API[@]}" \
            "${INFO[@]}"

          cmake --build ../out --config "$CONFIG" --parallel
          "../out/serein-tests/$CONFIG/test_serein"

      # WHY: Apple silicon only starts code with a signature; an ad-hoc one
      # needs no certificate and lets users allow a downloaded copy in Privacy
      # & Security, where a bundle without any signature is reported as damaged.
      - name: Ad-hoc signature.
        run: |
          app="$REPO_NAME/out/$CONFIG/SereinGram.app"
          for arch in x86_64 arm64; do
            lipo "$app/Contents/MacOS/SereinGram" -verify_arch "$arch"
          done
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"

      - name: Smoke test.
        timeout-minutes: 10
        run: |
          python3 "$REPO_NAME/tools/serein/smoke_test.py" \
            "$REPO_NAME/out/$CONFIG/SereinGram.app/Contents/MacOS/SereinGram"

      # WHY: the universal app already holds both builds, so the smaller
      # single-architecture apps are copies of it with one slice kept, signed
      # again because thinning changes the code that the signature covers.
      - name: Single-architecture apps.
        run: |
          for arch in arm64 x86_64; do
            app="$RUNNER_TEMP/$arch/SereinGram.app"
            mkdir -p "$RUNNER_TEMP/$arch"
            ditto "$REPO_NAME/out/$CONFIG/SereinGram.app" "$app"
            find "$app" -type f -print0 | while IFS= read -r -d '' file; do
              archs=$(lipo -archs "$file" 2>/dev/null) || continue
              case "$archs" in
                *' '*) lipo "$file" -thin "$arch" -output "$file" ;;
              esac
            done
            test "$(lipo -archs "$app/Contents/MacOS/SereinGram")" = "$arch"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
          done

      - name: Disk images.
        run: |
          retry="$REPO_NAME/tools/serein/retry.sh"
          mkdir artifact
          for flavor in universal arm64 x86_64; do
            app="$RUNNER_TEMP/$flavor/SereinGram.app"
            if [ "$flavor" = universal ]; then
              app="$REPO_NAME/out/$CONFIG/SereinGram.app"
            fi
            "$retry" 5 10 hdiutil create -volname SereinGram -srcfolder "$app" \
              -ov -format UDZO "artifact/SereinGram-macos-$flavor.dmg"
          done

      - name: Rosetta for the x86_64 app.
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true
          echo "ROSETTA=true" >> "$GITHUB_ENV"

      - name: Disk image integration test.
        timeout-minutes: 30
        run: |
          retry="$REPO_NAME/tools/serein/retry.sh"
          smoke="$REPO_NAME/tools/serein/smoke_test.py"
          for flavor in universal arm64 x86_64; do
            expected=$flavor
            if [ "$flavor" = universal ]; then
              expected="arm64 x86_64"
            fi
            mount=$(mktemp -d)
            "$retry" 5 10 hdiutil attach -nobrowse -readonly -mountpoint "$mount" \
              "artifact/SereinGram-macos-$flavor.dmg"
            binary="$mount/SereinGram.app/Contents/MacOS/SereinGram"
            codesign --verify --deep --strict "$mount/SereinGram.app"
            archs=$(lipo -archs "$binary" | tr ' ' '\n' | sort | xargs)
            if [ "$archs" != "$expected" ]; then
              echo "::error::SereinGram-macos-$flavor.dmg holds $archs instead of $expected."
              exit 1
            fi
            if [ "$flavor" != x86_64 ]; then
              python3 "$smoke" "$binary"
            elif [ "${ROSETTA:-}" = true ]; then
              python3 "$smoke" --timeout 300 "$binary"
            else
              echo "::warning::Rosetta 2 could not be installed, so the x86_64 app was not launched."
            fi
            # System services may still scan the app that just ran from the volume.
            "$retry" 5 5 hdiutil detach "$mount" || hdiutil detach -force "$mount"
          done

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        with:
          name: SereinGram-macos
          path: artifact/
          if-no-files-found: error
          retention-days: 3
