name: Serein guards.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:

  guards:
    name: Architecture guards
    runs-on: ubuntu-latest

    steps:
      - name: Clone.
        uses: actions/checkout@v7

      - name: Set up Buf.
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: 1.72.0

      - name: Set up uv.
        uses: astral-sh/setup-uv@v6

      - name: Tool self-tests.
        run: uv run --with jinja2==3.1.6 python -m unittest discover -s tools/serein/tests -v

      - name: Owned source files stay within 1000 lines.
        run: python3 tools/serein/check_file_size.py

      - name: Module boundaries hold.
        run: python3 tools/serein/check_boundaries.py

      - name: Feature matrix uses defined statuses.
        run: python3 tools/serein/check_features.py

      - name: Hook code does not reach shadowed page namespaces.
        run: python3 tools/serein/check_hook_namespaces.py

      - name: Every Serein source is registered in CMake.
        run: python3 tools/serein/check_sources.py

      - name: Fetch the libraries Serein includes from.
        run: |
          mapfile -t libs < <(git config --file .gitmodules --get-regexp 'path' \
            | awk '{print $2}' | grep '^Telegram/lib_')
          git submodule update --init --depth 1 Telegram/ThirdParty/OpenCC "${libs[@]}"

      - name: Includes name existing headers.
        run: python3 tools/serein/check_includes.py

      - name: Workflows pass actionlint.
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -shellcheck= .github/workflows/serein-*.yml

      - name: Fetch comparison baselines.
        env:
          SCHEMA_BASELINE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base=$(python3 -c "import json; print(json.load(open('tools/serein/policy/upstream.json'))['base'])")
          git fetch --no-tags --depth=1 origin "$base"
          if [[ ! "$SCHEMA_BASELINE" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$SCHEMA_BASELINE" || true
          fi

      - name: Upstream intrusion stays within budget.
        run: python3 tools/serein/upstream_budget.py --list

      - name: Schema lint.
        run: buf lint proto

      - name: Schema stays compatible.
        env:
          SCHEMA_BASELINE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: tools/serein/proto_breaking.sh "$SCHEMA_BASELINE"

      - name: Generated code matches the schema.
        run: uv run tools/serein/codegen/generate.py --check

  commits:
    name: Commit messages
    runs-on: ubuntu-latest

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          fetch-depth: 200

      - name: Set up Node.
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install commitlint.
        run: npm install --no-save --no-package-lock @commitlint/cli@19 @commitlint/config-conventional@19

      - name: New commits follow Conventional Commits in English.
        env:
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$FROM" =~ ^0+$ ]]; then
            FROM="$TO~1"
          fi
          # Upstream commits arrive through merges; only our mainline is linted.
          failed=0
          for sha in $(git rev-list --first-parent --reverse "$FROM..$TO"); do
            echo "Checking $(git log -1 --format='%h %s' "$sha")"
            git log -1 --format=%B "$sha" \
              | npx commitlint --config tools/serein/commitlint.config.mjs --verbose \
              || failed=1
          done
          exit "$failed"

  core-tests:
    name: Core tests (Qt only)
    runs-on: ubuntu-latest

    steps:
      - name: Clone.
        uses: actions/checkout@v7

      - name: Fetch the submodules the core needs.
        run: |
          git submodule update --init --depth 1 \
            Telegram/lib_base Telegram/lib_crl Telegram/lib_rpl Telegram/lib_ui \
            Telegram/ThirdParty/GSL Telegram/ThirdParty/range-v3 Telegram/ThirdParty/expected \
            Telegram/ThirdParty/OpenCC

      - name: Install OpenSSL headers.
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Set up Qt.
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.2
          cache: true

      # Same warnings as the Linux platform build, which fails on any of them.
      - name: Build.
        run: |
          cmake -S tools/serein/core_tests -B out/serein-core-tests \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wno-unused-parameter -Wno-switch -Wno-maybe-uninitialized -Wno-missing-field-initializers -Wno-sign-compare -Wno-deprecated -Wno-array-bounds -Wno-free-nonheap-object -Wno-stringop-overflow"
          cmake --build out/serein-core-tests --parallel "$(nproc)"

      - name: Test.
        run: ctest --test-dir out/serein-core-tests --output-on-failure
