name: Serein guards.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:

  guards:
    name: Architecture guards
    runs-on: ubuntu-latest

    steps:
      - name: Clone.
        uses: actions/checkout@v7

      - name: Guard self-tests.
        run: python3 -m unittest discover -s tools/serein/tests -v

      - name: Owned source files stay within 1000 lines.
        run: python3 tools/serein/check_file_size.py
