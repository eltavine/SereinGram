name: Serein Windows.

on:
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win*.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/serein-win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  pull_request:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win*.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/serein-win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  workflow_dispatch:
    inputs:
      arch:
        type: choice
        options: [x64, arm64]
        default: x64
      config:
        type: choice
        options: [Debug, Release]
        default: Debug
  workflow_call:
    inputs:
      arch:
        type: string
        default: x64
      config:
        type: string
        default: Debug
      ref:
        type: string
        default: ''
      channel:
        type: string
        default: ''
      no_cache:
        type: boolean
        default: false
    secrets:
      SEREIN_API_ID:
        required: false
      SEREIN_API_HASH:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-windows-${{ inputs.arch || 'x64' }}-${{ inputs.config || 'Debug' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  windows:
    name: Windows
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2025-vs2026' }}

    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(format('["{0}"]', inputs.arch || 'x64')) }}
        qt: [qt6]

    env:
      # Not CONFIG: MSYS2's pacman-key reads that variable as its config file.
      BUILD_CONFIG: ${{ inputs.config || 'Debug' }}
      ASSET_ARCH: ${{ (inputs.arch || 'x64') == 'arm64' && 'arm64' || 'x86_64' }}
      # Only these runs write caches: every branch and pull request can read the default branch's.
      SAVE_CACHE: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      # The Debug build fills the runner disk unless unused toolchains go.
      - name: Free runner disk space.
        shell: pwsh
        run: |
          Get-PSDrive C | Format-Table Name, Used, Free
          $unused = @(
            'C:\Android',
            'C:\Program Files (x86)\Android',
            'C:\Program Files\dotnet',
            'C:\hostedtoolcache\windows\CodeQL',
            'C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk',
            'C:\ghcup'
          )
          foreach ($path in $unused) {
            if (Test-Path $path) {
              cmd /c "rmdir /s /q `"$path`""
            }
          }
          Get-PSDrive C | Format-Table Name, Used, Free

      # Release compiles exhaust commit memory with the default pagefile; x64 runners keep C: tight.
      - name: Enlarge the pagefile.
        uses: al-cheb/configure-pagefile-action@9b6da52fb72a3c6147c1aad2df22d8d905681adc # v1.5
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: ${{ matrix.arch == 'arm64' && 'C:' || 'D:' }}

      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries${{ matrix.arch == 'x64' && '\win64' || '' }}>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"

      - name: Clone.
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" "$DOCPATH" | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> "$GITHUB_ENV"

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          sha256sum "$TBUILD/$REPO_NAME/$PREPARE_PATH" | awk '{ print $1 }' >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> "$GITHUB_ENV"

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: Install VS 2026 Build Tools.
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri https://aka.ms/vs/18/stable/vs_buildtools.exe -OutFile $exe `
            -MaximumRetryCount 5 -RetryIntervalSec 15
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList `
            '--quiet','--wait','--norestart','--nocache', `
            '--add','Microsoft.VisualStudio.Workload.VCTools', `
            '--add','Microsoft.VisualStudio.Component.VC.Tools.ARM64', `
            '--add','Microsoft.VisualStudio.Component.VC.ATL.ARM64'
          Remove-Item $exe -Force -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

      - uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223 # master
        name: Native Tools Command Prompt.
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}
          toolset: ${{ case(matrix.arch == 'arm64', '', '14.44') }}

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        if: ${{ !inputs.no_cache }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        if: ${{ !inputs.no_cache }}
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-v4-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-${{ matrix.arch }}-libs-v4-
            ${{ runner.OS }}-${{ matrix.arch }}-libs-v3-

      - name: Qt cache.
        id: cache-qt
        if: ${{ !inputs.no_cache }}
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt }}-v3-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt }}-v3-
            ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt }}-v2-

      # Remove once upstream prepare.py stops requesting mingw-w64-x86_64-diffutils.
      - name: Replace the removed MSYS2 diffutils package.
        shell: bash
        run: sed -i 's/mingw-w64-x86_64-diffutils/diffutils/' "$TBUILD/$REPO_NAME/$PREPARE_PATH"

      # SereinGram sends no crash reports, so the symbol dumper and the ATL it needs stay out.
      - name: Skip the Windows symbol dumper.
        shell: bash
        run: |
          sed -i -E -e '/windows.+dump_syms/d' -e '/dump_syms\.(gyp|vcxproj)/d' "$TBUILD/$REPO_NAME/$PREPARE_PATH"
          if grep -n 'dump_syms' "$TBUILD/$REPO_NAME/$PREPARE_PATH" | grep -iv 'mac'; then
            echo "prepare.py still builds the Windows symbol dumper." >&2
            exit 1
          fi

      # Debug and Release libraries, so both configurations share one cache.
      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent ${{ matrix.qt }}

      - name: Save the ThirdParty cache.
        if: ${{ !inputs.no_cache && env.SAVE_CACHE == 'true' && steps.cache-third-party.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ steps.cache-third-party.outputs.cache-primary-key }}

      - name: Choose the API credentials and the release channel.
        shell: bash
        env:
          SEREIN_API_ID: ${{ secrets.SEREIN_API_ID }}
          MSVC_ARCH: ${{ matrix.arch }}
          CHANNEL: ${{ inputs.channel }}
          COMMIT: ${{ inputs.ref }}
        run: |
          # Without the repository secrets, build with the test-only credentials.
          API=""
          if [ -z "$SEREIN_API_ID" ]; then
            API="-D TDESKTOP_API_TEST=ON"
          fi
          echo "TDESKTOP_BUILD_API=$API" >> "$GITHUB_ENV"
          INFO=""
          if [ -n "$CHANNEL" ]; then
            INFO="-D SEREIN_BUILD_CHANNEL=$CHANNEL -D SEREIN_BUILD_COMMIT=$COMMIT"
          fi
          echo "TDESKTOP_BUILD_INFO=$INFO" >> "$GITHUB_ENV"
          ARCH=$MSVC_ARCH
          if [ "$ARCH" = arm64 ]; then
            ARCH=arm
          fi
          echo "TDESKTOP_BUILD_ARCH=$ARCH" >> "$GITHUB_ENV"

      - name: Free up some disk space.
        shell: bash
        run: find "$LibrariesPath" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      # Saved after the cleanup, like upstream's post-job save, to leave build trees out.
      - name: Save the libraries cache.
        if: ${{ !inputs.no_cache && env.SAVE_CACHE == 'true' && steps.cache-libs.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Save the Qt cache.
        if: ${{ !inputs.no_cache && env.SAVE_CACHE == 'true' && steps.cache-qt.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-qt.outputs.cache-primary-key }}

      # cmake_helpers' Qt package still names zlib zlibstatic, the build makes libzs.
      - name: Provide the zlib names that the Qt package expects.
        run: |
          if exist "%LibrariesPath%\zlib\Debug\libzsd.lib" copy /Y "%LibrariesPath%\zlib\Debug\libzsd.lib" "%LibrariesPath%\zlib\Debug\zlibstaticd.lib"
          if exist "%LibrariesPath%\zlib\Release\libzs.lib" copy /Y "%LibrariesPath%\zlib\Release\libzs.lib" "%LibrariesPath%\zlib\Release\zlibstatic.lib"
          exit /b 0

      - name: Serein build.
        env:
          SEREIN_API_ID: ${{ secrets.SEREIN_API_ID }}
          SEREIN_API_HASH: ${{ secrets.SEREIN_API_HASH }}
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          %TDESKTOP_BUILD_ARCH% ^
          ${{ matrix.qt }} ^
          %TDESKTOP_BUILD_API% ^
          %TDESKTOP_BUILD_INFO% ^
          -D CMAKE_CONFIGURATION_TYPES=%BUILD_CONFIG% ^
          -D DESKTOP_APP_TEST_APPS=ON ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= || exit /b 1

          cmake --build ..\out --config %BUILD_CONFIG% --parallel || exit /b 1
          ..\out\serein-tests\%BUILD_CONFIG%\test_serein.exe

      - name: Smoke test.
        run: |
          cd %TBUILD%\%REPO_NAME%
          python tools\serein\smoke_test.py out\%BUILD_CONFIG%\SereinGram.exe

      - name: Installer.
        shell: pwsh
        run: |
          $root = "$env:TBUILD\$env:REPO_NAME"
          $version = (Select-String -Path "$root\Telegram\build\version" -Pattern '^AppVersionStr (.+)$').Matches[0].Groups[1].Value.Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            foreach ($attempt in 1..3) {
              choco install innosetup --no-progress -y
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 3) { exit $LASTEXITCODE }
              Start-Sleep -Seconds (30 * $attempt)
            }
          }
          & $iscc "/DMyAppVersion=$version" "/DMyAppVersionFull=$version" "/DReleasePath=$root\out\$env:BUILD_CONFIG" "/DMyBuildTarget=${{ matrix.arch == 'arm64' && 'winarm' || 'win64' }}" "$root\Telegram\build\setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Name the artifacts.
        shell: pwsh
        run: |
          $out = "$env:TBUILD\$env:REPO_NAME\out\$env:BUILD_CONFIG"
          $base = "SereinGram-windows-$env:ASSET_ARCH"
          New-Item -ItemType Directory -Force -Path artifact, portable\SereinGram | Out-Null
          Copy-Item "$out\SereinGram.exe" portable\SereinGram\
          Compress-Archive -Path portable\SereinGram -DestinationPath "artifact\$base-portable.zip"
          $setup = @(Get-ChildItem "$out\tsetup-*.exe")
          if ($setup.Count -ne 1) { throw "Expected one installer, found $($setup.Count)." }
          Move-Item $setup[0].FullName "artifact\$base-setup.exe"
          Get-ChildItem artifact

      - name: Package integration test.
        shell: pwsh
        run: |
          $base = "artifact\SereinGram-windows-$env:ASSET_ARCH"
          $portable = Join-Path $env:RUNNER_TEMP 'portable-check'
          Expand-Archive "$base-portable.zip" -DestinationPath $portable
          if (-not (Test-Path "$portable\SereinGram\SereinGram.exe")) { throw 'The portable archive lacks SereinGram.exe.' }
          $target = Join-Path $env:RUNNER_TEMP 'SereinGramInstall'
          $install = Start-Process -FilePath "$base-setup.exe" -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$target"
          if ($install.ExitCode -ne 0) { throw "The installer exited with code $($install.ExitCode)." }
          python "$env:TBUILD\$env:REPO_NAME\tools\serein\smoke_test.py" "$target\SereinGram.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        with:
          name: SereinGram-windows-${{ env.ASSET_ARCH }}
          path: artifact\
          if-no-files-found: error
          retention-days: 3
