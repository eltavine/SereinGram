name: Serein Arch Linux.

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'
    paths:
      - 'packaging/arch/**'
      - '.github/workflows/serein-arch.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  arch:
    name: Arch Linux package
    runs-on: ubuntu-latest
    timeout-minutes: 330
    container: archlinux:base-devel

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_SLOPPINESS: pch_defines,time_macros

    steps:
      - name: Install the build tools.
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Su --noconfirm --needed git ccache

      - name: Clone.
        uses: actions/checkout@v7
        with:
          path: SereinGram
          fetch-depth: 0

      - name: Restore the compiler cache.
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: arch-ccache-${{ github.run_id }}
          restore-keys: arch-ccache-

      - name: Build the package.
        env:
          SEREIN_API_ID: ${{ secrets.SEREIN_API_ID }}
          SEREIN_API_HASH: ${{ secrets.SEREIN_API_HASH }}
        run: |
          # Without the repository secrets, build with the test-only credentials.
          if [ -z "$SEREIN_API_ID" ]; then
            export SEREIN_API_TEST=1
          fi
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          mkdir -p "$CCACHE_DIR"
          chown -R builder SereinGram "$CCACHE_DIR"

          config=/etc/makepkg.ci.conf
          cp /etc/makepkg.conf "$config"
          cat >> "$config" <<'EOF'
          BUILDENV=(!distcc color ccache check !sign)
          OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug !lto)
          CXXFLAGS+=" -fpch-preprocess"
          EOF

          cd SereinGram/packaging/arch
          sed -i "s|git+https://github.com/eltavine/SereinGram.git#branch=develop|git+file://$GITHUB_WORKSPACE/SereinGram#commit=$GITHUB_SHA|" PKGBUILD
          grep -q "#commit=$GITHUB_SHA" PKGBUILD
          sudo -u builder \
            --preserve-env=SEREIN_API_ID,SEREIN_API_HASH,SEREIN_API_TEST,CCACHE_DIR,CCACHE_MAXSIZE,CCACHE_SLOPPINESS \
            makepkg --config "$config" --syncdeps --noconfirm
          sudo -u builder --preserve-env=CCACHE_DIR ccache --show-stats

      - name: Save the compiler cache.
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: arch-ccache-${{ github.run_id }}

      - name: Install and check the package.
        run: |
          cd SereinGram/packaging/arch
          package=$(ls sereingram-desktop-git-*.pkg.tar.zst)
          pacman -U --noconfirm "$package"
          for file in \
            usr/bin/SereinGram \
            usr/share/applications/io.github.eltavine.SereinGram.desktop \
            usr/share/metainfo/io.github.eltavine.SereinGram.metainfo.xml \
            usr/share/icons/hicolor/256x256/apps/io.github.eltavine.SereinGram.png; do
            test -f "/$file" || { echo "Missing /$file"; exit 1; }
          done
          if ldd /usr/bin/SereinGram | grep 'not found'; then
            exit 1
          fi

      - name: Upload the package.
        uses: actions/upload-artifact@v7
        with:
          name: SereinGram Arch Linux package
          path: SereinGram/packaging/arch/sereingram-desktop-git-*.pkg.tar.zst
          if-no-files-found: error
