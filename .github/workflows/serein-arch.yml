name: Serein Arch Linux.

on:
  push:
    branches:
      - main
    paths:
      - 'packaging/arch/**'
      - '.github/workflows/serein-arch.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      channel:
        type: string
        default: ''
    secrets:
      SEREIN_API_ID:
        required: false
      SEREIN_API_HASH:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-arch
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  arch:
    name: Arch Linux package
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    container: archlinux:base-devel

    steps:
      - name: Install the build tools.
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Su --noconfirm --needed git

      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: SereinGram
          fetch-depth: 0

      - name: Build the package.
        env:
          SEREIN_API_ID: ${{ secrets.SEREIN_API_ID }}
          SEREIN_API_HASH: ${{ secrets.SEREIN_API_HASH }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          # Without the repository secrets, build with the test-only credentials.
          if [ -z "$SEREIN_API_ID" ]; then
            export SEREIN_API_TEST=1
          fi
          if [ -n "$CHANNEL" ]; then
            export SEREIN_BUILD_PACKAGE=pacman SEREIN_BUILD_CHANNEL="$CHANNEL" SEREIN_BUILD_COMMIT="$GITHUB_SHA"
          fi
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder SereinGram

          config=/etc/makepkg.ci.conf
          cp /etc/makepkg.conf "$config"
          cat >> "$config" <<'EOF'
          OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug !lto)
          EOF

          cd SereinGram/packaging/arch
          sed -i "s|git+https://github.com/eltavine/SereinGram.git#branch=develop|git+file://$GITHUB_WORKSPACE/SereinGram#commit=$GITHUB_SHA|" PKGBUILD
          grep -q "#commit=$GITHUB_SHA" PKGBUILD
          sudo -u builder \
            --preserve-env=SEREIN_API_ID,SEREIN_API_HASH,SEREIN_API_TEST,SEREIN_BUILD_PACKAGE,SEREIN_BUILD_CHANNEL,SEREIN_BUILD_COMMIT \
            makepkg --config "$config" --syncdeps --noconfirm

      - name: Install and check the package.
        run: |
          cd SereinGram/packaging/arch
          package=$(ls sereingram-desktop-git-*.pkg.tar.zst)
          pacman -U --noconfirm "$package"
          for file in \
            usr/bin/SereinGram \
            usr/share/applications/io.github.eltavine.SereinGram.desktop \
            usr/share/metainfo/io.github.eltavine.SereinGram.metainfo.xml \
            usr/share/icons/hicolor/256x256/apps/io.github.eltavine.SereinGram.png; do
            test -f "/$file" || { echo "Missing /$file"; exit 1; }
          done
          if ldd /usr/bin/SereinGram | grep 'not found'; then
            exit 1
          fi

      - name: Name the package.
        run: |
          mkdir artifact
          mv SereinGram/packaging/arch/sereingram-desktop-git-*.pkg.tar.zst \
            artifact/SereinGram-linux-x86_64.pkg.tar.zst

      - name: Upload the package.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: artifact/SereinGram-linux-x86_64.pkg.tar.zst
          archive: false
          if-no-files-found: error
          retention-days: 3
