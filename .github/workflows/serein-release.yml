name: Serein release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Version tag, such as v7.2.10 or v7.2.10-beta.1. Leave it empty when the workflow runs
          on that tag; a tag that does not exist yet is created at the commit the workflow runs
          on once the draft release is published.
        type: string
        default: ''

concurrency:
  group: serein-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      credentials: ${{ steps.plan.outputs.credentials }}
      previous: ${{ steps.plan.outputs.previous }}
      since: ${{ steps.plan.outputs.since }}
      date: ${{ steps.plan.outputs.date }}

    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide what to release.
        id: plan
        env:
          INPUT_TAG: ${{ inputs.tag }}
          SEREIN_API_ID: ${{ secrets.SEREIN_API_ID }}
          SEREIN_API_HASH: ${{ secrets.SEREIN_API_HASH }}
        run: |
          tag=$INPUT_TAG
          if [ -z "$tag" ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          fi
          version='^v[0-9]+(\.[0-9]+)+(-[0-9A-Za-z.]+)?$'
          if ! [[ "$tag" =~ $version ]]; then
            echo "::error::Run the workflow on a vX.Y.Z tag, or name the tag to release in the tag input."
            exit 1
          fi
          tools/serein/retry.sh 3 15 git fetch --force --tags origin
          tagged=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$tag points at ${tagged::7}, not at ${GITHUB_SHA::7}; run the workflow on the tag itself."
            exit 1
          fi
          since=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
          previous=""
          if [ -n "$since" ]; then
            previous=$(git rev-parse "$since^{commit}")
          fi
          credentials="test"
          if [ -n "$SEREIN_API_ID" ] && [ -n "$SEREIN_API_HASH" ]; then
            credentials="own"
          fi
          {
            echo "tag=$tag"
            echo "credentials=$credentials"
            echo "previous=$previous"
            echo "since=${since:-the beginning}"
            echo "date=$(date -u +%Y-%m-%d)"
          } | tee -a "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: plan
    uses: ./.github/workflows/serein-ci.yml
    permissions:
      contents: read
      actions: write
    secrets:
      SEREIN_API_ID: ${{ secrets.SEREIN_API_ID }}
      SEREIN_API_HASH: ${{ secrets.SEREIN_API_HASH }}
    with:
      channel: release

  credentials:
    name: Release credentials
    needs: plan
    if: needs.plan.outputs.credentials != 'own'
    runs-on: ubuntu-24.04
    steps:
      - name: Report the missing SereinGram API credentials.
        run: |
          echo "::error::The SEREIN_API_ID and SEREIN_API_HASH repository secrets are not set, so this run builds with Telegram's test credentials and does not publish the release."
          exit 1

  publish:
    name: Publish
    needs: [plan, ci]
    if: needs.plan.outputs.credentials == 'own'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      COMMIT: ${{ github.sha }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      SINCE: ${{ needs.plan.outputs.since }}
      DATE: ${{ needs.plan.outputs.date }}

    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download the builds.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: SereinGram-*
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Check the release structure.
        run: python3 tools/serein/release.py verify dist

      - name: Checksums, manifest and notes.
        run: |
          info=(--repo "$GITHUB_REPOSITORY" --tag "$TAG" --channel release
            --commit "$COMMIT" --date "$DATE")
          python3 tools/serein/release.py manifest dist "${info[@]}" \
            -o "$RUNNER_TEMP/release.json"
          python3 tools/serein/release.py checksums dist \
            -o "$RUNNER_TEMP/SHA256SUMS"
          python3 tools/serein/release.py notes "${info[@]}" \
            --previous "$PREVIOUS" --since "$SINCE" -o "$RUNNER_TEMP/notes.md"
          mv "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/SHA256SUMS" dist/
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Upload the draft release.
        run: |
          if ! tools/serein/retry.sh 3 10 gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=()
            if [[ "$TAG" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$TAG" --draft --target "$COMMIT" "${prerelease[@]}" \
              --title "SereinGram $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          tools/serein/retry.sh 3 30 gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Check the published files.
        run: |
          tools/serein/retry.sh 3 10 gh release view "$TAG" --json assets > "$RUNNER_TEMP/published.json"
          python3 tools/serein/release.py uploaded dist "$RUNNER_TEMP/published.json"
