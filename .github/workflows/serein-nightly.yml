name: Serein nightly.

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: serein-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  ci:
    name: CI
    uses: ./.github/workflows/serein-ci.yml
    permissions:
      contents: read
      actions: write
    secrets:
      SEREIN_API_ID: ${{ secrets.SEREIN_API_ID }}
      SEREIN_API_HASH: ${{ secrets.SEREIN_API_HASH }}
    with:
      channel: ${{ github.ref_name == github.event.repository.default_branch && 'nightly' || '' }}

  publish:
    name: Publish
    needs: ci
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT: ${{ github.sha }}

    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download the builds.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: SereinGram-*
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Check the release structure.
        run: python3 tools/serein/release.py verify dist

      - name: Find the published nightly.
        id: published
        run: |
          tools/serein/retry.sh 3 15 git fetch --force --tags origin
          previous=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)
          outdated=false
          if [ -n "$previous" ] && [ "$previous" != "$COMMIT" ] \
            && git merge-base --is-ancestor "$COMMIT" "$previous"; then
            outdated=true
            echo "::notice::The nightly already holds ${previous::7}, which is newer than this commit."
          fi
          {
            echo "previous=$previous"
            echo "outdated=$outdated"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Checksums, manifest and notes.
        id: notes
        if: steps.published.outputs.outdated == 'false'
        env:
          PREVIOUS: ${{ steps.published.outputs.previous }}
          SEREIN_API_ID: ${{ secrets.SEREIN_API_ID }}
          SEREIN_API_HASH: ${{ secrets.SEREIN_API_HASH }}
        run: |
          date=$(date -u +%Y-%m-%d)
          info=(--repo "$GITHUB_REPOSITORY" --tag nightly --channel nightly
            --commit "$COMMIT" --date "$date")
          notice=()
          if [ -z "$SEREIN_API_ID" ] || [ -z "$SEREIN_API_HASH" ]; then
            notice=(--test-credentials)
            echo "::warning::The SEREIN_API_ID and SEREIN_API_HASH repository secrets are not set, so this nightly is built with Telegram's test credentials and its notes say so."
          fi
          python3 tools/serein/release.py manifest dist "${info[@]}" \
            -o "$RUNNER_TEMP/release.json"
          python3 tools/serein/release.py checksums dist \
            -o "$RUNNER_TEMP/SHA256SUMS"
          python3 tools/serein/release.py notes "${info[@]}" "${notice[@]}" \
            --previous "$PREVIOUS" --since "the previous nightly" -o "$RUNNER_TEMP/notes.md"
          mv "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/SHA256SUMS" dist/
          (cd dist && sha256sum -c SHA256SUMS)
          echo "title=SereinGram Nightly $date (${COMMIT::7})" >> "$GITHUB_OUTPUT"

      # WHY: the fixed nightly release is updated in place, so its links keep working: every file
      # is replaced by name, files of earlier builds are dropped only after the upload, and the tag
      # moves last, once the release holds exactly this build.
      - name: Replace the nightly files.
        if: steps.published.outputs.outdated == 'false'
        env:
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          retry=tools/serein/retry.sh
          if ! "$retry" 3 10 gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --prerelease --target "$COMMIT" \
              --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          mapfile -t binaries < <(find dist -maxdepth 1 -type f \
            ! -name SHA256SUMS ! -name release.json | sort)
          "$retry" 3 30 gh release upload nightly "${binaries[@]}" --clobber
          "$retry" 3 30 gh release upload nightly dist/SHA256SUMS dist/release.json --clobber
          "$retry" 3 10 gh release view nightly --json assets --jq '.assets[].name' \
            > "$RUNNER_TEMP/assets.txt"
          while read -r name; do
            if [ ! -f "dist/$name" ]; then
              "$retry" 3 10 gh release delete-asset nightly "$name" --yes
            fi
          done < "$RUNNER_TEMP/assets.txt"
          if "$retry" 3 10 gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" >/dev/null 2>&1; then
            "$retry" 3 10 gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" \
              -f sha="$COMMIT" -F force=true >/dev/null
          else
            "$retry" 3 10 gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/nightly -f sha="$COMMIT" >/dev/null
          fi
          "$retry" 3 10 gh release edit nightly --target "$COMMIT" --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/notes.md" --prerelease --draft=false

      - name: Check the published files.
        if: steps.published.outputs.outdated == 'false'
        run: |
          for wait in 10 20 40 0; do
            if gh release view nightly --json assets > "$RUNNER_TEMP/published.json" \
              && python3 tools/serein/release.py uploaded dist "$RUNNER_TEMP/published.json" \
              && [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha)" = "$COMMIT" ]; then
              exit 0
            fi
            sleep "$wait"
          done
          echo "::error::The nightly release does not hold exactly the files and the commit of this build."
          exit 1
