name: Serein Linux.

on:
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/serein-linux.yml'
      - 'snap/**'
      - 'Telegram/build/**'
      - '!Telegram/build/docker/centos_env/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.bat'
      - 'Telegram/Telegram.plist'
  pull_request:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/serein-linux.yml'
      - 'snap/**'
      - 'Telegram/build/**'
      - '!Telegram/build/docker/centos_env/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.bat'
      - 'Telegram/Telegram.plist'
  workflow_dispatch:
    inputs:
      arch:
        type: choice
        options: [x86_64, arm64]
        default: x86_64
      config:
        type: choice
        options: [Debug, Release]
        default: Release
  workflow_call:
    inputs:
      arch:
        type: string
        default: x86_64
      config:
        type: string
        default: Debug
      ref:
        type: string
        default: ''
      channel:
        type: string
        default: ''
    secrets:
      SEREIN_API_ID:
        required: false
      SEREIN_API_HASH:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-linux-${{ inputs.arch || 'x86_64' }}-${{ inputs.config || 'Debug' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  linux:
    name: ${{ inputs.arch == 'arm64' && 'Rocky Linux 8 (arm64)' || 'Rocky Linux 8' }}
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      actions: write

    env:
      CONFIG: ${{ inputs.config || 'Debug' }}
      ARCH: ${{ inputs.arch || 'x86_64' }}
      KEY_ARCH: ${{ inputs.arch == 'arm64' && 'arm64-' || '' }}
      # WHY: only default-branch runs write caches, which every branch and pull request can read.
      # A schedule event has no repository payload, but scheduled runs only start on the default branch.
      SAVE_CACHE: ${{ github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      IMAGE_TAG: tdesktop:centos_env

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: First set up.
        env:
          CCACHE_SHA256: 508b2a1217dc6e04a23e967c7b95a0fb45d8a7e16fde9e180919698f2e2be060
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3; then
              break
            elif [ "$attempt" = 3 ]; then
              echo "::warning::apt-get update kept failing; installing from the existing package lists."
            else
              sleep 60
            fi
          done
          retry="$GITHUB_WORKSPACE/tools/serein/retry.sh"
          download=(curl -fsSL --retry 5 --retry-all-errors --retry-delay 10)
          "${download[@]}" -o "$RUNNER_TEMP/install-poetry.py" https://install.python-poetry.org
          "$retry" 3 30 python3 "$RUNNER_TEMP/install-poetry.py" --version 2.5.1
          if [ "$ARCH" = x86_64 ]; then
            "${download[@]}" -o "$RUNNER_TEMP/ccache.tar.xz" \
              https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz
            echo "$CCACHE_SHA256  $RUNNER_TEMP/ccache.tar.xz" | sha256sum -c -
            sudo tar -xJf "$RUNNER_TEMP/ccache.tar.xz" -C /usr/local/bin --strip-components=1 \
              ccache-4.13.6-linux-x86_64-glibc/ccache
          else
            "$retry" 3 30 sudo apt-get install -y -o Acquire::Retries=3 ccache
          fi
          echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> "$GITHUB_ENV"
          cd Telegram/build/docker/centos_env
          "$retry" 3 30 poetry install
          DOCKERFILE=$(DEBUG='' LTO='' poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          if [ "$ARCH" = arm64 ]; then
            python3 "$GITHUB_WORKSPACE/tools/serein/patch_dockerfile.py" Dockerfile
          fi
          rm -rf __pycache__

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          preinstalled-runtimes: true

      - name: Set up Docker Buildx.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ runner.OS }}-${{ env.KEY_ARCH }}libs-v2-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.OS }}-${{ env.KEY_ARCH }}libs-

      # The builder keeps the finished layers, so a second attempt resumes after a network error.
      - name: Libraries.
        id: libraries
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Libraries, second attempt.
        if: steps.libraries.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache.
        run: |
          rm -rf "${{ runner.temp }}/.buildx-cache"
          mv "${{ runner.temp }}/.buildx-cache-new" "${{ runner.temp }}/.buildx-cache"

      # Set after the image: as a build argument it would change every commit's image cache.
      - name: Pin the source date.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Save the libraries cache.
        if: env.SAVE_CACHE == 'true' && steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Restore Telegram Desktop cache.
        id: cache-tdesktop
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.OS }}-tdesktop-${{ env.KEY_ARCH }}${{ env.CONFIG }}-${{ github.run_id }}
          restore-keys: ${{ runner.OS }}-tdesktop-${{ env.KEY_ARCH }}${{ env.CONFIG }}-

      - name: Serein build.
        env:
          SEREIN_API_ID: ${{ secrets.SEREIN_API_ID }}
          SEREIN_API_HASH: ${{ secrets.SEREIN_API_HASH }}
          CHANNEL: ${{ inputs.channel }}
          COMMIT: ${{ inputs.ref }}
        run: |
          # Without the repository secrets, build with the test-only credentials.
          API=()
          if [ -z "$SEREIN_API_ID" ]; then
            API=(-D TDESKTOP_API_TEST=ON)
          fi
          if [ "$CONFIG" = Debug ]; then
            FLAGS=(-D CMAKE_C_FLAGS_DEBUG="-O0 -fpch-preprocess"
              -D CMAKE_CXX_FLAGS_DEBUG="-O0 -fpch-preprocess")
          else
            FLAGS=(-D CMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG -fpch-preprocess"
              -D CMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG -fpch-preprocess")
          fi
          # Upstream code assumes the signed char of every other target, and
          # GCC reports inlined std::shared_ptr destructors as dangling on arm64.
          if [ "$ARCH" = arm64 ]; then
            FLAGS+=(-D CMAKE_C_FLAGS=-fsigned-char
              -D "CMAKE_CXX_FLAGS=-fsigned-char -Wno-error=dangling-pointer")
          fi
          if [ -n "$CHANNEL" ]; then
            FLAGS+=(-D SEREIN_BUILD_CHANNEL="$CHANNEL" -D SEREIN_BUILD_COMMIT="$COMMIT")
          fi

          ccache -z

          docker run --rm \
          -u "$(id -u)" \
          -v "$PWD:/usr/src/tdesktop" \
          -v "$CCACHE_DIR:/var/cache/ccache" \
          -e CONFIG \
          -e KEEP_GOING=1 \
          -e SEREIN_API_ID \
          -e SEREIN_API_HASH \
          -e SOURCE_DATE_EPOCH \
          -e CCACHE_SLOPPINESS=pch_defines,time_macros \
          "$IMAGE_TAG" \
          env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES="$CONFIG" \
          -D DESKTOP_APP_TEST_APPS=ON \
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON \
          "${FLAGS[@]}" \
          "${API[@]}"

          docker run --rm \
          -u "$(id -u)" \
          -v "$PWD:/usr/src/tdesktop" \
          "$IMAGE_TAG" \
          "/usr/src/tdesktop/out/serein-tests/$CONFIG/test_serein"

      - name: Count ccache misses.
        id: ccache-stats
        if: "!cancelled()"
        run: |
          MISSES=$(ccache --print-stats | sed -n 's/^cache_miss\t//p' | head -1)
          case "$MISSES" in (*[!0-9]*|'') MISSES=0;; esac
          echo "misses=$MISSES" >> "$GITHUB_OUTPUT"
          echo "ccache misses this run: $MISSES"
          ccache --print-stats | grep -E '^(cache_size_kibibyte|files_in_cache)\b' || true

      - name: Trim Telegram Desktop cache.
        if: >
          !cancelled()
            && env.SAVE_CACHE == 'true'
            && fromJSON(steps.ccache-stats.outputs.misses) > 300
        run: ccache --evict-older-than 1d

      - name: Save Telegram Desktop cache.
        id: save-tdesktop
        if: >
          !cancelled()
            && env.SAVE_CACHE == 'true'
            && fromJSON(steps.ccache-stats.outputs.misses) > 300
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-tdesktop.outputs.cache-primary-key }}

      # Keeping one compiler cache per configuration leaves the platform caches inside the quota.
      - name: Drop older Telegram Desktop caches.
        if: "!cancelled() && steps.save-tdesktop.outcome == 'success'"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ steps.cache-tdesktop.outputs.cache-primary-key }}
          PREFIX: ${{ runner.OS }}-tdesktop-${{ env.KEY_ARCH }}${{ env.CONFIG }}-
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key "$PREFIX" --limit 100 \
            --json key --jq '.[].key' \
          | { grep -vxF "$KEEP" || true; } \
          | while read -r key; do
            gh cache delete "$key" -R "$GITHUB_REPOSITORY"
          done

      - name: Runtime libraries resolve.
        run: |
          binary="out/$CONFIG/SereinGram"
          echo "File size of $binary: $(stat -c %s "$binary") bytes."
          if ldd "$binary" | grep 'not found'; then
            echo "The binary needs libraries the system does not have." >&2
            exit 1
          fi

      - name: Smoke test.
        timeout-minutes: 15
        run: |
          tools/serein/retry.sh 3 30 sudo apt-get install -y -o Acquire::Retries=3 xvfb
          xvfb-run -a python3 tools/serein/smoke_test.py "out/$CONFIG/SereinGram"

      - name: Portable archive.
        run: |
          mkdir -p artifact "$RUNNER_TEMP/portable/SereinGram"
          install -m755 "out/$CONFIG/SereinGram" "$RUNNER_TEMP/portable/SereinGram/"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$SOURCE_DATE_EPOCH" -C "$RUNNER_TEMP/portable" \
            -cJf "artifact/SereinGram-linux-$ARCH.tar.xz" SereinGram

      - name: AppImage.
        env:
          APPIMAGE_ARCH: ${{ inputs.arch == 'arm64' && 'aarch64' || 'x86_64' }}
          APPIMAGETOOL_SHA256: ${{ inputs.arch == 'arm64' && 'f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158' || 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0' }}
          RUNTIME_SHA256: ${{ inputs.arch == 'arm64' && '00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444' || '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d' }}
        run: |
          tool="$RUNNER_TEMP/appimagetool"
          runtime="$RUNNER_TEMP/runtime-$APPIMAGE_ARCH"
          download=(curl -fsSL --retry 5 --retry-all-errors --retry-delay 10)
          "${download[@]}" -o "$tool" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$APPIMAGE_ARCH.AppImage"
          "${download[@]}" -o "$runtime" \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-$APPIMAGE_ARCH"
          echo "$APPIMAGETOOL_SHA256  $tool" | sha256sum -c -
          echo "$RUNTIME_SHA256  $runtime" | sha256sum -c -
          chmod +x "$tool"
          app="$RUNNER_TEMP/SereinGram.AppDir"
          install -Dm755 "out/$CONFIG/SereinGram" "$app/usr/bin/SereinGram"
          install -Dm644 Telegram/Resources/art/icon256.png \
            "$app/io.github.eltavine.SereinGram.png"
          sed '/^DBusActivatable=/d' lib/xdg/io.github.eltavine.SereinGram.desktop \
            > "$app/io.github.eltavine.SereinGram.desktop"
          ln -s usr/bin/SereinGram "$app/AppRun"
          retry=tools/serein/retry.sh
          "$retry" 3 30 sudo apt-get update -q
          "$retry" 3 30 sudo apt-get install -y -q --no-install-recommends zsync
          release=nightly
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release=latest
          fi
          name="SereinGram-linux-$ARCH.AppImage"
          update="gh-releases-zsync|${GITHUB_REPOSITORY%%/*}|${GITHUB_REPOSITORY#*/}|$release|$name.zsync"
          (cd artifact && ARCH=$APPIMAGE_ARCH "$tool" --appimage-extract-and-run \
            --runtime-file "$runtime" --updateinformation "$update" "$app" "$name")
          test -s "artifact/$name.zsync"

      - name: Debian and RPM packages.
        env:
          NFPM_ASSET: ${{ inputs.arch == 'arm64' && 'Linux_arm64' || 'Linux_x86_64' }}
          NFPM_SHA256: ${{ inputs.arch == 'arm64' && '1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c' || '0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783' }}
          SEREIN_PACKAGE_ARCH: ${{ inputs.arch == 'arm64' && 'arm64' || 'amd64' }}
        run: |
          archive="$RUNNER_TEMP/nfpm.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$archive" \
            "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_$NFPM_ASSET.tar.gz"
          echo "$NFPM_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" nfpm
          stage="$RUNNER_TEMP/packages"
          packaging/nfpm/stage.sh "out/$CONFIG/SereinGram" \
            lib/xdg/io.github.eltavine.SereinGram.metainfo.xml "$stage"
          version=$(sed -n 's/^AppVersionStrSmall *//p' Telegram/build/version)
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            version="$version+g$(git rev-parse --short=7 HEAD)"
          fi
          for packager in deb rpm; do
            (cd "$stage" && SEREIN_VERSION="$version" "$RUNNER_TEMP/nfpm" package \
              --config "$GITHUB_WORKSPACE/packaging/nfpm/nfpm.yaml" \
              --packager "$packager" \
              --target "$GITHUB_WORKSPACE/artifact/SereinGram-linux-$ARCH.$packager")
          done
          ls -l artifact

      - name: AppImage integration test.
        timeout-minutes: 15
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: xvfb-run -a python3 tools/serein/smoke_test.py "artifact/SereinGram-linux-$ARCH.AppImage"

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        with:
          name: SereinGram-linux-${{ env.ARCH }}
          path: artifact/
          if-no-files-found: error
          retention-days: 3

  # WHY: the distribution test depends on outside mirrors; in its own job a
  # failure there is re-run in minutes without rebuilding, and a release still
  # waits for it because the calling job only succeeds with both.
  packages:
    name: ${{ inputs.arch == 'arm64' && 'Linux packages (arm64)' || 'Linux packages' }}
    needs: linux
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      ARCH: ${{ inputs.arch || 'x86_64' }}

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          sparse-checkout: tools/serein

      - name: Download the packages.
        uses: actions/download-artifact@v8
        with:
          name: SereinGram-linux-${{ env.ARCH }}
          path: artifact

      # The packages must install with their declared dependencies on clean systems.
      - name: Package integration test.
        run: tools/serein/linux_package_test.sh artifact "$ARCH"
