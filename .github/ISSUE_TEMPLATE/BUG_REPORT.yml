name: 🐞 Bug report
description: Report errors or unexpected behavior in SereinGram.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        SereinGram is an unofficial client and is not affiliated with Telegram, Nagram or AyuGram,
        so report SereinGram problems here and never to them. Questions go to the
        [SereinGram chat](https://t.me/SereinGram_chat).
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behaviour
      placeholder: Tell us what should happen
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behaviour
      placeholder: Tell us what happens instead
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system
      description: |
        Write exact OS (e.g. Windows 11, macOS 14, Ubuntu 24.04 GNOME).
        * 🛑 NO KERNEL VERSIONS (uname)
    validations:
      required: true
  - type: input
    attributes:
      label: SereinGram version
      description: |
        Copy it from Settings → SereinGram or the About page (e.g. 7.2.10 · Nightly 8dc2ccb).
        * 🛑 DO NOT WRITE "LATEST". We will instantly close the issue.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Installation source
      multiple: false
      options:
        - Windows installer
        - Windows portable executable
        - macOS disk image
        - Linux AppImage or portable executable
        - Linux .deb or .rpm package
        - Flatpak bundle
        - Snap package
        - Arch Linux package or PKGBUILD
        - Nix flake
        - Built from source
        - Other source
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Official Telegram Desktop
      description: Does the problem also happen in official Telegram Desktop?
      multiple: false
      options:
        - No, only in SereinGram
        - Yes, also in official Telegram Desktop
        - Not checked
    validations:
      required: true
  - type: textarea
    attributes:
      label: SereinGram options
      description: Which SereinGram options are on, and does the problem go away when you turn them off?
  - type: textarea
    attributes:
      label: Logs
      description: >
        Type the word `viewlogs`
        [directly into your settings menu](https://github.com/telegramdesktop/tdesktop/wiki/Cheat-Codes)
        to open the logs folder.
      placeholder: Insert log.txt here
      render: shell
