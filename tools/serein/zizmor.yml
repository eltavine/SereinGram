rules:
  # actionlint 1.7.12 rejects the $/ self-repository syntax, so the release calls keep ./ paths.
  self-repository:
    ignore:
      - serein-release.yml
  # The Windows build keeps upstream's cmd steps, which zizmor cannot analyse.
  misfeature:
    ignore:
      - serein-win.yml
  # commitlint and its preset are installed at exact versions; there is no lockfile to install from.
  adhoc-packages:
    ignore:
      - serein-guards.yml
